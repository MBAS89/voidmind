# VoidMind — Production Nginx Configuration (Performance Tuned)
# Place this in /etc/nginx/sites-available/voidmind and symlink to sites-enabled

# Worker tuning
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Buffers for large headers (JWT can be long)
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # Gzip compression for JSON responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # Upstream with keepalive
    upstream voidmind_backend {
        server 127.0.0.1:3000;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your-domain.com;  # CHANGE THIS

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        # Modern TLS configuration
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Request size limit
        client_max_body_size 1m;

        # Timeouts tuned for AI inference
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;  # Allow long streaming responses

        # Proxy buffering — disable for SSE streaming
        proxy_buffering off;
        proxy_cache off;

        # Proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check (public, no rate limit)
        location /health {
            proxy_pass http://voidmind_backend;
        }

        # Prometheus metrics (internal network only)
        location /metrics {
            allow 10.0.0.0/8;    # Private network
            allow 172.16.0.0/12; # Private network
            allow 127.0.0.1;     # Localhost
            deny all;
            proxy_pass http://voidmind_backend;
        }

        # User API
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://voidmind_backend;
        }

        # Admin API (stricter rate limit)
        location /admin/ {
            limit_req zone=admin burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://voidmind_backend;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
